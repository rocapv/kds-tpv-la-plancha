<VirtualHost *:80>
    # home.pr1.es · KDS + TPV Cantina Vesta-9 (22/09/2026).
    # Antes este nombre era Jellyfin; ahora Jellyfin vive en jellyfin.starcitizen.es y en el
    # puerto 5580. Aquí manda el TPV, y por decisión expresa SÍ se atiende desde internet.
    ServerName home.pr1.es

    DocumentRoot /var/www/html
    <Directory /var/www/html>
        Options -Indexes
        AllowOverride None
        Require all granted
    </Directory>

    # Reto ACME (Let's Encrypt) servido desde webroot, NO proxiar
    ProxyPass /.well-known/acme-challenge !
    Alias /.well-known/acme-challenge /var/www/home.pr1.es/.well-known/acme-challenge
    <Directory /var/www/home.pr1.es/.well-known/acme-challenge>
        Require all granted
    </Directory>

    # Por aquí se teclea un PIN: en claro no. Todo lo que no sea el reto ACME se manda a HTTPS.
    RewriteEngine On
    RewriteCond %{REQUEST_URI} !^/\.well-known/acme-challenge/
    RewriteRule ^/?(.*)$ https://home.pr1.es/$1 [R=301,L]

    ErrorLog  ${APACHE_LOG_DIR}/home.pr1.es-error.log
    CustomLog ${APACHE_LOG_DIR}/home.pr1.es-access.log combined
</VirtualHost>
