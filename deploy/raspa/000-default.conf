<VirtualHost *:80>
	ServerAdmin webmaster@localhost
	DocumentRoot /var/www/html

	ErrorLog ${APACHE_LOG_DIR}/error.log
	CustomLog ${APACHE_LOG_DIR}/access.log combined

	# ───────────────── KDS + TPV Cantina Vesta-9 ─────────────────
	# El document root ES el frontal del KDS (lo publica deploy/raspa/publicar.sh) y la API
	# vive detrás, en 127.0.0.1:8092, sin puerto abierto a la red.
	#
	# El sistema es de un local: solo la LAN entra. Esto NO es un extra, es lo que sustituye
	# a la guarda que el propio servicio hacía cuando escuchaba en la red: ahora todas las
	# peticiones le llegan desde Apache con IP 127.0.0.1, así que si aquí no se filtra, no
	# filtra nadie. Y el puerto 80 de esta máquina SÍ está publicado en internet.
	<Directory /var/www/html>
		Options -Indexes
		AllowOverride None
		Require ip 127.0.0.1 ::1 192.168.1.0/24
	</Directory>

	# Excepción: el reto de Let's Encrypt tiene que poder contestarle a medio mundo, o los
	# certificados de esta máquina dejan de renovarse.
	<Directory /var/www/html/.well-known>
		Require all granted
	</Directory>

	# OJO con /api/: `sites-enabled/director-ocr.conf` declara un <Location /api/> FUERA de
	# todo vhost, asi que se aplica a TODOS y se lleva el /api de cualquier sitio a la API OCR
	# del Director (127.0.0.1:5001). Por eso aqui se sobreescribe con otro <Location>, que al
	# ser del vhost se fusiona despues y gana: el Director sigue teniendo su OCR en los demas
	# nombres, y este vhost tiene su TPV. Un ProxyPass suelto NO basta, lo tapaba el Location.
	<Location /api/>
		ProxyPass        http://127.0.0.1:8092/api/
		ProxyPassReverse http://127.0.0.1:8092/api/
		Require ip 127.0.0.1 ::1 192.168.1.0/24
	</Location>
	<Location /docs>
		Require ip 127.0.0.1 ::1 192.168.1.0/24
	</Location>

	ProxyPreserveHost On
	# El WebSocket de las pantallas (y /ws/publico, que cae en la misma regla por prefijo).
	ProxyPass        /ws            ws://127.0.0.1:8092/ws
	ProxyPass        /docs          http://127.0.0.1:8092/docs
	ProxyPassReverse /docs          http://127.0.0.1:8092/docs
	ProxyPass        /openapi.json  http://127.0.0.1:8092/openapi.json
	ProxyPassReverse /openapi.json  http://127.0.0.1:8092/openapi.json

	# Hetero Demo - WebSocket proxy
	RewriteEngine On
	RewriteCond %{HTTP:Upgrade} websocket [NC]
	RewriteCond %{HTTP:Connection} upgrade [NC]
	RewriteRule ^/hetero/ws/(.*) ws://127.0.0.1:8080/ws/$1 [P,L]

	# Hetero Demo - API proxy
	ProxyPass /hetero/api/ http://127.0.0.1:8080/api/
	ProxyPassReverse /hetero/api/ http://127.0.0.1:8080/api/

	# API verify endpoint — DESACTIVADO el 22/09/2026: apuntaba a /var/www/html/api/verify,
	# que ya no existe, y /api es ahora del KDS. Se deja a la vista por si hay que recuperarlo
	# en otra ruta que no invada la de la API del TPV.
	#RewriteRule ^/api/verify/([0-9]+)$ /api/verify/index.php [QSA,L]
	#<Directory /var/www/html/api/verify>
	#	Options -Indexes
	#	Require all granted
	#</Directory>

	# Director API v2 (FastAPI :8086) — mas especifico primero.
	# /me se queda en :8085 a proposito: esa version trae settings,
	# specialties, certifications, accent_color y can_view_discord_stats,
	# que la web usa y la de api_fastapi no tiene.
	ProxyPass        /director/api/v2/          http://127.0.0.1:8086/api/v2/
	ProxyPassReverse /director/api/v2/          http://127.0.0.1:8086/api/v2/
	ProxyPass        /director/api/docs         http://127.0.0.1:8086/api/docs
	ProxyPassReverse /director/api/docs         http://127.0.0.1:8086/api/docs
	ProxyPass        /director/api/openapi.json http://127.0.0.1:8086/api/openapi.json
	ProxyPassReverse /director/api/openapi.json http://127.0.0.1:8086/api/openapi.json

	# Director Web API proxy (legacy :8085, catch-all)
	ProxyPass /director/api/ http://127.0.0.1:8085/api/
	ProxyPassReverse /director/api/ http://127.0.0.1:8085/api/

</VirtualHost>
