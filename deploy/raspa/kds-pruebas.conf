# KDS + TPV · sitio de PRUEBAS en Raspa, puerto 8093, SOLO LAN.
#
# Sirve otra copia del frontal (/var/www/kds_pruebas) contra la MISMA API que producción, para
# poder mirar una pantalla nueva antes de publicarla en home.pr1.es. Publicar aquí:
#     bash deploy/raspa/publicar.sh <carpeta-frontend> /var/www/kds_pruebas
# Los datos son los de verdad: lo que se cobre aquí, se cobra.
Listen 8093
<VirtualHost *:8093>
    ServerName kds-pruebas.local
    DocumentRoot /var/www/kds_pruebas
    <Directory /var/www/kds_pruebas>
        Options -Indexes
        AllowOverride None
        Require ip 127.0.0.1 ::1 192.168.1.0/24
    </Directory>

    # Mismo truco que en el vhost de producción: el <Location /api/> global de director-ocr
    # se lleva el /api si no se sobreescribe aquí.
    <Location /api/>
        ProxyPass        http://127.0.0.1:8092/api/
        ProxyPassReverse http://127.0.0.1:8092/api/
        Require ip 127.0.0.1 ::1 192.168.1.0/24
    </Location>
    ProxyPreserveHost On
    ProxyPass        /ws            ws://127.0.0.1:8092/ws
    ProxyPass        /docs          http://127.0.0.1:8092/docs
    ProxyPassReverse /docs          http://127.0.0.1:8092/docs
    ProxyPass        /openapi.json  http://127.0.0.1:8092/openapi.json
    ProxyPassReverse /openapi.json  http://127.0.0.1:8092/openapi.json

    ErrorLog  ${APACHE_LOG_DIR}/kds-pruebas-error.log
    CustomLog ${APACHE_LOG_DIR}/kds-pruebas-access.log combined
</VirtualHost>
