<VirtualHost *:443>
    # home.pr1.es · KDS + TPV Cantina Vesta-9 (22/09/2026). Antes Jellyfin.
    ServerName home.pr1.es

    SSLEngine on
    # Certificado de Let's Encrypt (22/09/2026): por aquí se teclea el PIN desde internet y el
    # autofirmado de antes obligaba a saltarse un aviso del navegador. Además, sin certificado
    # de confianza el navegador NO registra el service worker y el TPV pierde el modo sin red.
    SSLCertificateFile    /etc/letsencrypt/live/home.pr1.es/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/home.pr1.es/privkey.pem

    DocumentRoot /var/www/html
    <Directory /var/www/html>
        Options -Indexes
        AllowOverride None
        Require all granted
    </Directory>

    # NO TOCAR: túnel permanente que entra por el 443 (chisel de la VM). Va primero porque
    # cualquier regla más general se lo llevaría por delante.
    ProxyPreserveHost On
    AllowEncodedSlashes NoDecode
    ProxyPass        /tc312e5d9b3cdde7f05901496  ws://127.0.0.1:8765/  keepalive=on timeout=3600
    ProxyPassReverse /tc312e5d9b3cdde7f05901496  ws://127.0.0.1:8765/

    # La API del TPV. Igual que en el vhost por defecto, hay que ganarle el /api/ al
    # <Location /api/> global de director-ocr.conf, que si no se lo lleva a la API OCR.
    <Location /api/>
        ProxyPass        http://127.0.0.1:8092/api/
        ProxyPassReverse http://127.0.0.1:8092/api/
    </Location>
    ProxyPass        /ws            ws://127.0.0.1:8092/ws
    ProxyPass        /docs          http://127.0.0.1:8092/docs
    ProxyPassReverse /docs          http://127.0.0.1:8092/docs
    ProxyPass        /openapi.json  http://127.0.0.1:8092/openapi.json
    ProxyPassReverse /openapi.json  http://127.0.0.1:8092/openapi.json

    # Un año de HSTS: quien haya entrado una vez no vuelve a salir a la red en claro.
    Header always set Strict-Transport-Security "max-age=31536000"

    ErrorLog  ${APACHE_LOG_DIR}/home.pr1.es-ssl-error.log
    CustomLog ${APACHE_LOG_DIR}/home.pr1.es-ssl-access.log combined
</VirtualHost>
