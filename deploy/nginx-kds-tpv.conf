# Configuración de nginx para cuando se dispone de root en la máquina (lo normal en producción).
# Deja la aplicación escuchando solo en 127.0.0.1:8000 y nginx hace de frontal TLS en 443.
#
#   sudo apt install -y nginx
#   sudo cp deploy/nginx-kds-tpv.conf /etc/nginx/sites-available/kds-tpv
#   sudo ln -s /etc/nginx/sites-available/kds-tpv /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# En la Mint del aula no hay root disponible, así que el TLS lo termina el propio uvicorn
# en el puerto 8443 (deploy/kds-tpv.service). El resultado para el navegador es el mismo.

server {
    listen 80;
    server_name kds.local;
    return 301 https://$host$request_uri;          # nadie teclea su PIN sobre HTTP
}

server {
    listen 443 ssl http2;
    server_name kds.local;

    ssl_certificate     /etc/ssl/kds-tpv/cert.pem;
    ssl_certificate_key /etc/ssl/kds-tpv/key.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options    "nosniff" always;
    add_header X-Frame-Options           "SAMEORIGIN" always;
    add_header Referrer-Policy           "same-origin" always;

    client_max_body_size 2m;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # El KDS vive del WebSocket: sin estas dos cabeceras se queda sin comandas.
    location /ws {
        proxy_pass http://127.0.0.1:8000/ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host       $host;
        proxy_read_timeout 1h;                      # la cocina no habla, pero escucha todo el turno
    }
}
