<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Carta · Cantina Vesta-9</title>
<link rel="stylesheet" href="/css/estilo.css?v=__V__">
</head>
<body class="cliente">

<header class="barra-cliente">
  <div>
    <h1 id="local">Cantina</h1>
    <small id="donde" class="tenue"></small>
  </div>
  <span class="hueco"></span>
  <button id="b-tema" class="tema" title="Cambiar entre día y noche" aria-label="Cambiar tema">
    <span class="astro"></span>
  </button>
  <span id="conexion" class="conexion"></span>
</header>

<p id="mensaje" class="aviso-local"></p>

<!-- Seguimiento de la comanda propia: en vez de un diálogo que hay que abrir, una tira que
     se queda a la vista y avanza sola (canal público + sondeo). -->
<section id="mi-comanda" class="mi-comanda" hidden aria-live="polite">
  <div class="cab">
    <b id="mc-titulo">Tu comanda</b>
    <span class="hueco"></span>
    <button id="mc-detalle" class="sutil">Detalle</button>
    <button id="mc-olvidar" class="sutil" title="Dejar de seguir esta comanda" aria-label="Dejar de seguir">✕</button>
  </div>
  <ol class="pasos" id="mc-pasos">
    <li data-paso="enviada"><span>1</span>Enviada</li>
    <li data-paso="confirmada"><span>2</span>Confirmada</li>
    <li data-paso="cocina"><span>3</span>En cocina</li>
    <li data-paso="lista"><span>4</span>Lista</li>
    <li data-paso="servida"><span>5</span>Servida</li>
  </ol>
  <p id="mc-texto"></p>
</section>

<section class="destacados" id="destacados" hidden>
  <h2>Lo que más sale</h2>
  <div class="pila" id="pila"></div>
  <div class="mandos">
    <button id="d-antes" aria-label="Anterior">‹</button>
    <span id="d-cuenta" class="tenue"></span>
    <button id="d-despues" aria-label="Siguiente">›</button>
  </div>
</section>

<details class="leyenda" id="leyenda">
  <summary>Alérgenos: qué significa cada marca</summary>
  <div id="leyenda-lista"></div>
</details>

<nav class="cats-cliente" id="cats"></nav>

<main id="carta" class="carta-cliente"></main>

<!-- Cesta: barra fija abajo, que es donde llega el pulgar -->
<footer class="cesta" id="cesta" hidden>
  <button id="b-ver" class="ver-cesta">
    <span id="n-cesta">0</span> productos · <b id="t-cesta">0,00 €</b>
    <span class="tenue">ver</span>
  </button>
  <button id="b-enviar" class="primario">Pedir</button>
</footer>

<dialog id="d-cesta">
  <h3>Tu comanda</h3>
  <div id="lista-cesta"></div>
  <div class="fila total-cesta"><span>Total</span><b id="t-dialogo">0,00 €</b></div>
  <label class="campo">Mesa
    <select id="c-mesa"></select>
  </label>
  <label class="campo">Tu nombre (opcional)
    <input id="c-nombre" maxlength="60" placeholder="Para llamarte cuando esté listo">
  </label>
  <label class="campo">Aviso para cocina (opcional)
    <input id="c-nota" maxlength="160" placeholder="Alergias, sin cebolla…">
  </label>
  <div class="fila"><button id="c-cancelar">Seguir mirando</button><button id="c-ok" class="primario">Enviar comanda</button></div>
</dialog>

<dialog id="d-estado">
  <h3 id="e-titulo">Tu comanda</h3>
  <div id="e-cuerpo"></div>
  <div class="fila"><button id="e-cerrar" class="primario">Cerrar</button></div>
</dialog>

<script src="/js/comun.js?v=__V__"></script>
<script src="/js/cliente.js?v=__V__"></script>
</body>
</html>
