<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Burglar King, 10 logos</title>
<style>
  :root { --fondo:#1a1714; --tarjeta:#242019; --texto:#f6ead2; --suave:#a89c86; }
  * { box-sizing: border-box; }
  body { margin:0; padding:24px 16px 48px; background:var(--fondo); color:var(--texto); font-family:Arial, sans-serif; }
  h1 { margin:0 0 4px; font-size:28px; }
  p.sub { margin:0 0 24px; color:var(--suave); }
  .rejilla { display:grid; grid-template-columns:repeat(auto-fill, minmax(240px, 1fr)); gap:16px; max-width:1200px; }
  figure { margin:0; background:var(--tarjeta); border-radius:14px; padding:12px; }
  figure img { width:100%; height:auto; display:block; border-radius:10px; }
  figcaption { padding:10px 4px 2px; font-size:15px; }
  figcaption b { color:#f2b632; margin-right:6px; }
  figcaption small { display:block; color:var(--suave); margin-top:2px; }
</style>
</head>
<body>
<h1>Burglar King</h1>
<p class="sub">10 propuestas de logo, todas vectoriales (SVG) y originales.</p>
<div class="rejilla">
  <figure><img src="01_antifaz_corona.svg" alt=""><figcaption><b>01</b>Antifaz y corona<small>Corona de oro sobre antifaz de ladrón.</small></figcaption></figure>
  <figure><img src="02_sello_circular.svg" alt=""><figcaption><b>02</b>Sello circular<small>Insignia redonda con texto en el aro.</small></figcaption></figure>
  <figure><img src="03_llave_corona.svg" alt=""><figcaption><b>03</b>Llave-corona<small>Llave maestra con empuñadura de corona.</small></figcaption></figure>
  <figure><img src="04_hamburguesa_bandida.svg" alt=""><figcaption><b>04</b>Hamburguesa bandida<small>Hamburguesa con antifaz y corona, la más cercana al producto.</small></figcaption></figure>
  <figure><img src="05_escudo_bk.svg" alt=""><figcaption><b>05</b>Escudo BK<small>Monograma heráldico con antifaz.</small></figcaption></figure>
  <figure><img src="06_ojos_en_la_noche.svg" alt=""><figcaption><b>06</b>Ojos en la noche<small>Silueta con ojos brillantes sobre el nombre.</small></figcaption></figure>
  <figure><img src="07_camiseta_a_rayas.svg" alt=""><figcaption><b>07</b>Camiseta a rayas<small>El clásico ladrón de rayas, en emblema.</small></figcaption></figure>
  <figure><img src="08_cerradura_hamburguesa.svg" alt=""><figcaption><b>08</b>Cerradura<small>Ojo de cerradura con la hamburguesa dentro.</small></figcaption></figure>
  <figure><img src="09_minimal_tipografico.svg" alt=""><figcaption><b>09</b>Minimalista tipográfico<small>Solo letra y una corona; el más sobrio.</small></figcaption></figure>
  <figure><img src="10_estacion_orbital.svg" alt=""><figcaption><b>10</b>Estación orbital<small>Planeta con anillo, guiño a la estación espacial.</small></figcaption></figure>
</div>
</body>
</html>
