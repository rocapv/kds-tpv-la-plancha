  <g><rect x="0" y="0" width="26" height="26" fill="#E67E22"/><text x="40" y="21">Materia prima y consumibles · 10.470 €</text></g>
  <g transform="translate(0,46)"><rect x="0" y="0" width="26" height="26" fill="#D35400"/><text x="40" y="21">Personal (sueldos, cotizaciones y autónomo) · 9.100 €</text></g>
  <g transform="translate(0,92)"><rect x="0" y="0" width="26" height="26" fill="#7F8C8D"/><text x="40" y="21">Alquiler del local · 1.000 € (3 %)</text></g>
  <g transform="translate(0,138)"><rect x="0" y="0" width="26" height="26" fill="#95A5A6"/><text x="40" y="21">Suministros, seguros, gestoría y mantenimiento · 2.300 €</text></g>
