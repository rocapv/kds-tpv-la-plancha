<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="560" viewBox="0 0 1600 560" font-family="Liberation Sans">
<rect width="1600" height="560" fill="#fff"/>
<defs><marker id="a" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#555"/></marker></defs>
<g font-size="25" text-anchor="middle">
<rect x="30" y="80" width="260" height="140" rx="14" fill="#fdebd9" stroke="#e67e22" stroke-width="3"/><text x="160" y="140" fill="#333" font-weight="bold">1. Nota</text><text x="160" y="178" font-size="21" fill="#555">comandero de papel</text>
<rect x="340" y="80" width="260" height="140" rx="14" fill="#fdebd9" stroke="#e67e22" stroke-width="3"/><text x="470" y="140" fill="#333" font-weight="bold">2. A cocina</text><text x="470" y="178" font-size="21" fill="#555">copia pinchada y a voz</text>
<rect x="650" y="80" width="260" height="140" rx="14" fill="#fdebd9" stroke="#e67e22" stroke-width="3"/><text x="780" y="140" fill="#333" font-weight="bold">3. Preparación</text><text x="780" y="178" font-size="21" fill="#555">orden de memoria</text>
<rect x="960" y="80" width="260" height="140" rx="14" fill="#fdebd9" stroke="#e67e22" stroke-width="3"/><text x="1090" y="140" fill="#333" font-weight="bold">4. Al pase</text><text x="1090" y="178" font-size="21" fill="#555">«¡sale la 7!»</text>
<rect x="1270" y="80" width="300" height="140" rx="14" fill="#fdebd9" stroke="#e67e22" stroke-width="3"/><text x="1420" y="140" fill="#333" font-weight="bold">5. Cobro</text><text x="1420" y="178" font-size="21" fill="#555">se teclea otra vez en el TPV</text>
</g>
<g stroke="#555" stroke-width="4" marker-end="url(#a)"><line x1="290" y1="150" x2="334" y2="150"/><line x1="600" y1="150" x2="644" y2="150"/><line x1="910" y1="150" x2="954" y2="150"/><line x1="1220" y1="150" x2="1264" y2="150"/></g>
<g font-size="21" fill="#c0392b" text-anchor="middle">
<circle cx="160" cy="290" r="22" fill="#c0392b"/><text x="160" y="298" fill="#fff" font-weight="bold">!</text><text x="160" y="350">letra ilegible,</text><text x="160" y="378">notas que se pierden</text>
<circle cx="470" cy="290" r="22" fill="#c0392b"/><text x="470" y="298" fill="#fff" font-weight="bold">!</text><text x="470" y="350">sin hora de entrada</text><text x="470" y="378">ni de salida</text>
<circle cx="780" cy="290" r="22" fill="#c0392b"/><text x="780" y="298" fill="#fff" font-weight="bold">!</text><text x="780" y="350">nadie ve el retraso</text><text x="780" y="378">hasta que se queja la mesa</text>
<circle cx="1090" cy="290" r="22" fill="#c0392b"/><text x="1090" y="298" fill="#fff" font-weight="bold">!</text><text x="1090" y="350">platos fríos esperando</text><text x="1090" y="378">al camarero</text>
<circle cx="1420" cy="290" r="22" fill="#c0392b"/><text x="1420" y="298" fill="#fff" font-weight="bold">!</text><text x="1420" y="350">doble tecleo: errores</text><text x="1420" y="378">y descuadres de caja</text>
</g>
<text x="800" y="490" text-anchor="middle" font-size="23" fill="#666">El dato solo entra en un sistema informático en el paso 5, cuando el cliente ya se va.</text>
</svg>
